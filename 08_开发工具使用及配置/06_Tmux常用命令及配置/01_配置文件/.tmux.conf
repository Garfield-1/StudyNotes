# tmux 配置文件
# 使用方法: 复制到 ~/.tmux.conf 后执行 tmux source-file ~/.tmux.conf 生效
# 适用版本: tmux >= 2.1 (鼠标选项), 部分选项需 >= 3.2

# ==================== 通用设置 ====================
# 历史回滚缓冲区行数
set -g history-limit 10000
# 开启 256 色支持
set -g default-terminal "tmux-256color"
# 启用 truecolor (RGB) 支持
set -ga terminal-overrides ",xterm-256color:Tc"
# 缩短命令响应延迟, 按下前缀键后无需等待太久
set -sg escape-time 10
# 窗口和窗格编号从 1 开始 (默认 0, 1 离主键位更近)
set -g base-index 1
setw -g pane-base-index 1
# 窗口被关闭后自动重新编号
set -g renumber-windows on
# 活动窗口时给出提示 (状态栏高亮)
setw -g monitor-activity on
set -g visual-activity off
# 保持终端标题同步
set -g set-titles on
# 增加状态栏消息的显示时间 (秒)
set -g display-time 3000

# ==================== 鼠标支持 ====================
# 开启鼠标: 支持点击切换窗格/窗口, 拖动调整窗格大小, 滚轮翻页
set -g mouse on

# ==================== 按键绑定 ====================
# r 键重新加载配置文件
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 用 | 和 - 分割窗格 (更直观), 新窗格继承当前路径
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新建窗口时同样继承当前路径
bind c new-window -c "#{pane_current_path}"

# 使用 vim 风格 h/j/k/l 在窗格间移动
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 使用 H/J/K/L 调整窗格大小, 可连续按
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+方向键直接切换窗格 (无需前缀键)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 快速切换窗口: Shift+左/右方向键 (无需前缀键)
bind -n S-Left previous-window
bind -n S-Right next-window

# v 键进入复制模式, 复制模式中使用 vim 按键 (h/j/k/l 移动, / ? 搜索等)
setw -g mode-keys vi
bind v copy-mode

# -------------------- 复制模式中的 vim 按键 --------------------
# v 开始选择, V 选择整行, y 复制选中内容并退出复制模式
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Esc 取消选择并退出复制模式
bind -T copy-mode-vi Escape send-keys -X cancel
# g/G 跳到缓冲区顶部/底部 (同 vim 的 gg/G)
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
# Ctrl-u/Ctrl-d 向上/向下翻半页 (同 vim)
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
# / 向下搜索, ? 向上搜索 (同 vim)
bind -T copy-mode-vi / command-prompt -p "(search down)" "send -X search-down \"%%%\""
bind -T copy-mode-vi ? command-prompt -p "(search up)" "send -X search-up \"%%%\""
# n/N 跳到下一个/上一个搜索结果
bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-reverse

# p 键粘贴缓冲区内容
bind p paste-buffer

# x 关闭窗格时无需二次确认
bind x kill-pane

# ==================== 复制模式外观 ====================
# 复制模式选中区域高亮样式
set -g mode-style "fg=colour232,bg=colour39"

# ==================== 状态栏 ====================
# 状态栏位置与刷新间隔 (秒)
set -g status-position bottom
set -g status-interval 5
# 状态栏整体样式
set -g status-style "bg=colour235,fg=colour136"
# 左侧显示会话名
set -g status-left "#[fg=colour232,bg=colour39,bold] #S #[default] "
set -g status-left-length 30
# 右侧显示主机名与时间
set -g status-right "#[fg=colour248] #H #[fg=colour232,bg=colour245] %Y-%m-%d %H:%M "
# 窗口标签样式: 当前窗口高亮, 活动窗口带 * 标记
setw -g window-status-format "#[fg=colour244] #I:#W "
setw -g window-status-current-format "#[fg=colour232,bg=colour39,bold] #I:#W "
setw -g window-status-activity-style "fg=colour166,bold"

# ==================== 窗格边框 ====================
# 普通窗格边框颜色
set -g pane-border-style "fg=colour238"
# 当前活动窗格边框高亮
set -g pane-active-border-style "fg=colour39"

# ==================== 消息提示 ====================
# 命令行/消息提示的样式
set -g message-style "bg=colour39,fg=colour232,bold"
